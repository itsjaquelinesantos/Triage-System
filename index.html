<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema de Triagem</title>

    <link rel="stylesheet" href="style.css">



</head>


<body>


<div class="caixa">


    <!-- ========================= -->
    <!-- CABEÇALHO -->
    <!-- ========================= -->

    <div class="cabecalho">

        <div class="icone-hospital">
            🏥
        </div>

        <h1>
            Triage System

        <p class="subtitulo">
            Preencha os dados do paciente para identificar
            a prioridade de atendimento.
        </p>

    </div>


    <!-- ========================= -->
    <!-- DADOS DO PACIENTE -->
    <!-- ========================= -->

    <div class="dados">

        <div class="titulo-secao">
             Dados do paciente
        </div>


        <div class="campo campo-nome">

            <label for="nome">
                Nome completo
            </label>

            <input
                type="text"
                id="nome"
                placeholder="Digite o nome do paciente"
            >

        </div>


        <div class="linha">

            <div class="campo">

                <label for="idade">
                    Idade
                </label>

                <input
                    type="number"
                    id="idade"
                    placeholder="Ex.: 35"
                    min="1"
                >

            </div>


            <div class="campo">

                <label for="peso">
                    Peso (kg)
                </label>

                <input
                    type="number"
                    id="peso"
                    placeholder="Ex.: 70"
                    step="0.1"
                    min="1"
                >

            </div>


            <div class="campo">

                <label for="altura">
                    Altura (m)
                </label>

                <input
                    type="number"
                    id="altura"
                    placeholder="Ex.: 1.70"
                    step="0.01"
                    min="0.1"
                >

            </div>

        </div>

    </div>


    <!-- ========================= -->
    <!-- SINTOMAS -->
    <!-- ========================= -->

    <div class="sintomas">

        <div class="titulo-secao">
            🩺 Sintomas
        </div>


        <p class="descricao-sintomas">
            Marque todos os sintomas apresentados pelo paciente:
        </p>


        <div class="lista-sintomas">


            <label class="sintoma">

                <input
                    type="checkbox"
                    id="febre"
                >

                <span>
                     Febre
                </span>

            </label>


            <label class="sintoma">

                <input
                    type="checkbox"
                    id="tosse"
                >

                <span>
                     Tosse
                </span>

            </label>


            <label class="sintoma">

                <input
                    type="checkbox"
                    id="dorCabeca"
                >

                <span>
                     Dor de cabeça
                </span>

            </label>


            <label class="sintoma">

                <input
                    type="checkbox"
                    id="faltaAr"
                >

                <span>
                     Falta de ar
                </span>

            </label>


            <label class="sintoma">

                <input
                    type="checkbox"
                    id="dorPeito"
                >

                <span>
                     Dor no peito
                </span>

            </label>


            <label class="sintoma">

                <input
                    type="checkbox"
                    id="sangramento"
                >

                <span>
                     Sangramento
                </span>

            </label>


        </div>

    </div>


    <!-- ========================= -->
    <!-- BOTÃO -->
    <!-- ========================= -->

    <button onclick="verificarTriagem()">

         Verificar Triagem

    </button>


    <!-- ========================= -->
    <!-- RESULTADO -->
    <!-- ========================= -->

    <div id="resultado"></div>


    <!-- ========================= -->
    <!-- RODAPÉ -->
    <!-- ========================= -->

    <div class="rodape">

        Sistema demonstrativo de triagem • Feira de Tecnologia

    </div>


</div>



<script src="script.js"></script>


</body>

</html>
